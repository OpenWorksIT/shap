# Weekly: updates and security fixes for what Shap is built from, each as a pull request that
# goes through CI (ci.yml) before it can reach main, and stable. docs/AUDIT.md.
# SPDX-License-Identifier: AGPL-3.0-or-later
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker-compose
    directories: [/deploy/vps, /deploy/test]
    schedule: { interval: weekly }
