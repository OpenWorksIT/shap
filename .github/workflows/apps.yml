# Tests, then builds the Android and iPhone apps.
# Every push: an installable Android test build (APK) and an iPhone simulator build, as artifacts.
# Store builds (signed .aab for Google Play, .ipa uploaded to App Store Connect) run when the
# signing secrets are set: see docs/app-stores.md.
name: Apps

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: known vulnerabilities in what the app ships (high and critical fail, unless accepted)
        run: node scripts/audit-deps.mjs
      - name: every outside address in the code is on the privacy list
        run: node scripts/privacy-hosts.mjs

  android:
    needs: test
    runs-on: ubuntu-24.04
    env:
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm -w @shap/web run build
      - run: npx cap sync android
        working-directory: apps/web
      - name: Test build (APK)
        working-directory: apps/web/android
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: shap-pocket-android-test-apk
          path: apps/web/android/app/build/outputs/apk/debug/*.apk
      - name: Store build (signed AAB)
        if: env.HAS_SIGNING == 'true'
        working-directory: apps/web/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # The secret is the key file as base64 text (base64 -w0 shap-pocket-upload.jks), not the file itself.
          if ! printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n' | grep -Eq '^[A-Za-z0-9+/]+=*$'; then
            echo "::error::ANDROID_KEYSTORE_BASE64 isn't base64 text. Run: base64 -w0 shap-pocket-upload.jks > key.txt and paste what's in key.txt."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/upload.jks"
          keytool -list -keystore "$RUNNER_TEMP/upload.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null \
            || { echo "::error::The keystore opened wrongly: check ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS (upload)."; exit 1; }
          ./gradlew --no-daemon bundleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
      - uses: actions/upload-artifact@v4
        if: env.HAS_SIGNING == 'true'
        with:
          name: shap-pocket-android-store-aab
          path: |
            apps/web/android/app/build/outputs/bundle/release/*.aab
            apps/web/android/app/build/outputs/mapping/release/mapping.txt

  ios:
    needs: test
    # Xcode 26 / iOS 26 SDK: required for App Store Connect uploads
    runs-on: macos-26
    env:
      HAS_SIGNING: ${{ secrets.ASC_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm -w @shap/web run build
      - run: npx cap sync ios
        working-directory: apps/web
      - name: Simulator build
        working-directory: apps/web/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          cd build/Build/Products/Debug-iphonesimulator && zip -qry "$GITHUB_WORKSPACE/ShapPocket-simulator.zip" App.app
      - uses: actions/upload-artifact@v4
        with:
          name: shap-pocket-ios-simulator
          path: ShapPocket-simulator.zip
      - name: Check the store secrets
        if: env.HAS_SIGNING == 'true'
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_KEY_P8 }}
          CERT_KEY: ${{ secrets.IOS_CERT_KEY }}
        run: |
          # the shape of each secret, without showing it, so a typo is named rather than a bare 401
          bad=""
          printf '%s' "$TEAM" | grep -Eq '^[A-Z0-9]{10}$' || bad="$bad APPLE_TEAM_ID (10 letters/digits);"
          printf '%s' "$KEY_ID" | grep -Eq '^[A-Z0-9]{10}$' || bad="$bad ASC_KEY_ID (10 letters/digits);"
          printf '%s' "$ISSUER" | grep -Eq '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$' || bad="$bad ASC_ISSUER_ID (xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx);"
          printf '%s' "$P8" | grep -q 'BEGIN PRIVATE KEY' || bad="$bad ASC_KEY_P8 (the whole .p8 file);"
          printf '%s' "$CERT_KEY" | grep -q 'PRIVATE KEY-----' || bad="$bad IOS_CERT_KEY (the distribution certificate's RSA key, as for LineGuard and Steady);"
          [ -z "$bad" ] || { echo "::error title=Store secrets::Check:$bad"; exit 1; }
          echo "::notice title=Store secrets::All five look the right shape (key ID ends ${KEY_ID: -2})"

      # Signing as LineGuard and Steady do: an App Store distribution certificate (for IOS_CERT_KEY)
      # and profile, fetched or created through the App Store Connect API with Codemagic's CLI
      # tools (GPL-3.0). No registered iPhone and no cloud signing needed.
      - name: Signing files
        if: env.HAS_SIGNING == 'true'
        working-directory: apps/web
        env:
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.ASC_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.ASC_KEY_P8 }}
          CERT_KEY: ${{ secrets.IOS_CERT_KEY }}
        run: |
          run() {
            "$@" > "$RUNNER_TEMP/step.txt" 2>&1 && { cat "$RUNNER_TEMP/step.txt"; return 0; }
            cat "$RUNNER_TEMP/step.txt"
            echo "::error title=$1 $2::$(sed 's/%/%25/g' "$RUNNER_TEMP/step.txt" | tail -c 6000 | awk '{printf "%s%%0A", $0}')"
            exit 1
          }
          # the tools want a traditional "BEGIN RSA PRIVATE KEY" PEM: convert a PKCS#8 one
          key=$(mktemp)
          printf '%s\n' "$CERT_KEY" > "$key"
          if ! grep -q 'BEGIN RSA PRIVATE KEY' "$key"; then
            /usr/bin/openssl rsa -in "$key" -out "$key.rsa" 2>/dev/null || openssl rsa -in "$key" -traditional -out "$key.rsa"
            grep -q 'BEGIN RSA PRIVATE KEY' "$key.rsa" || { echo "::error title=IOS_CERT_KEY::Couldn't read IOS_CERT_KEY as an RSA private key."; exit 1; }
            export CERTIFICATE_PRIVATE_KEY="$(cat "$key.rsa")"
          else
            export CERTIFICATE_PRIVATE_KEY="$(cat "$key")"
          fi
          rm -f "$key" "$key.rsa"
          run pipx install codemagic-cli-tools==0.70.2
          run keychain initialize
          run app-store-connect fetch-signing-files za.co.openworks.shappocket --type IOS_APP_STORE --create
          run keychain add-certificates
          # sets the App target to the fetched profile and writes ~/export_options.plist
          run xcode-project use-profiles --project ios/App/App.xcodeproj

      - name: Build and sign
        if: env.HAS_SIGNING == 'true'
        working-directory: apps/web/ios/App
        run: |
          set -o pipefail
          report() {
            msg=$(grep -E "error:|\*\* (ARCHIVE|EXPORT) FAILED|No profiles|No signing|provisioning profile|Code Signing Error" "$1" | sort -u | head -25 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
            [ -n "$msg" ] || msg=$(tail -30 "$1" | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::error title=$2::${msg}"
          }
          VERSION=$(node -p "require('../../package.json').version")
          BUILD=$(( GITHUB_RUN_NUMBER + 100 ))
          if ! xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/ShapPocket.xcarchive" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" \
            archive > "$RUNNER_TEMP/archive.log" 2>&1; then
            report "$RUNNER_TEMP/archive.log" "Archive failed"
            exit 1
          fi
          tail -5 "$RUNNER_TEMP/archive.log"
          if ! xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/ShapPocket.xcarchive" \
            -exportOptionsPlist "$HOME/export_options.plist" -exportPath "$RUNNER_TEMP/export" \
            > "$RUNNER_TEMP/export.log" 2>&1; then
            report "$RUNNER_TEMP/export.log" "Export failed"
            exit 1
          fi
          ls -l "$RUNNER_TEMP/export"

      - name: Upload to App Store Connect
        if: env.HAS_SIGNING == 'true'
        env:
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.ASC_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.ASC_KEY_P8 }}
        run: |
          ipa=$(find "$RUNNER_TEMP/export" -name '*.ipa' | head -1)
          if ! app-store-connect publish --path "$ipa" > "$RUNNER_TEMP/publish.txt" 2>&1; then
            cat "$RUNNER_TEMP/publish.txt"
            echo "::error title=Upload failed::$(sed 's/%/%25/g' "$RUNNER_TEMP/publish.txt" | tail -c 6000 | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi
          cat "$RUNNER_TEMP/publish.txt"
          echo "::notice title=TestFlight::Uploaded build $(( GITHUB_RUN_NUMBER + 100 )). Apple takes 10-30 minutes to process it."

      - name: Remove signing material
        if: always() && env.HAS_SIGNING == 'true'
        run: keychain clean > /dev/null 2>&1 || true
