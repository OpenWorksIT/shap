# Tests, then builds the Android and iPhone apps.
# Every push: an installable Android test build (APK) and an iPhone simulator build, as artifacts.
# Store builds (signed .aab for Google Play, .ipa uploaded to App Store Connect) run when the
# signing secrets are set: see docs/app-stores.md.
name: Apps

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  android:
    needs: test
    runs-on: ubuntu-24.04
    env:
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm -w @shap/web run build
      - run: npx cap sync android
        working-directory: apps/web
      - name: Test build (APK)
        working-directory: apps/web/android
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: shap-pocket-android-test-apk
          path: apps/web/android/app/build/outputs/apk/debug/*.apk
      - name: Store build (signed AAB)
        if: env.HAS_SIGNING == 'true'
        working-directory: apps/web/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # The secret is the key file as base64 text (base64 -w0 shap-pocket-upload.jks), not the file itself.
          if ! printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n' | grep -Eq '^[A-Za-z0-9+/]+=*$'; then
            echo "::error::ANDROID_KEYSTORE_BASE64 isn't base64 text. Run: base64 -w0 shap-pocket-upload.jks > key.txt and paste what's in key.txt."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/upload.jks"
          keytool -list -keystore "$RUNNER_TEMP/upload.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null \
            || { echo "::error::The keystore opened wrongly: check ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS (upload)."; exit 1; }
          ./gradlew --no-daemon bundleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
      - uses: actions/upload-artifact@v4
        if: env.HAS_SIGNING == 'true'
        with:
          name: shap-pocket-android-store-aab
          path: |
            apps/web/android/app/build/outputs/bundle/release/*.aab
            apps/web/android/app/build/outputs/mapping/release/mapping.txt

  ios:
    needs: test
    runs-on: macos-15
    env:
      HAS_SIGNING: ${{ secrets.ASC_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm -w @shap/web run build
      - run: npx cap sync ios
        working-directory: apps/web
      - name: Simulator build
        working-directory: apps/web/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          cd build/Build/Products/Debug-iphonesimulator && zip -qry "$GITHUB_WORKSPACE/ShapPocket-simulator.zip" App.app
      - uses: actions/upload-artifact@v4
        with:
          name: shap-pocket-ios-simulator
          path: ShapPocket-simulator.zip
      - name: Check the App Store Connect key
        if: env.HAS_SIGNING == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        # Signs a short token with the key and asks Apple for the app list, so a wrong ID or key
        # fails here with Apple's own reason (never printing the secrets).
        run: |
          node --input-type=module -e '
            import { createSign, createPrivateKey } from "node:crypto";
            const { ASC_KEY_ID: kid, ASC_ISSUER_ID: iss, ASC_KEY_P8: p8 } = process.env;
            console.log("Key ID: " + kid.length + " characters; issuer ID: " + iss.length + " characters (a UUID is 36)");
            let key;
            try { key = createPrivateKey(p8.trim()); } catch (e) { console.log("::error::The .p8 key could not be read: paste the whole file, BEGIN and END lines included"); process.exit(1); }
            const b64 = (o) => Buffer.from(JSON.stringify(o)).toString("base64url");
            const now = Math.floor(Date.now() / 1000);
            const head = b64({ alg: "ES256", kid: kid.trim(), typ: "JWT" });
            const body = b64({ iss: iss.trim(), iat: now, exp: now + 600, aud: "appstoreconnect-v1" });
            const sig = createSign("SHA256").update(head + "." + body).sign({ key, dsaEncoding: "ieee-p1363" }).toString("base64url");
            const r = await fetch("https://api.appstoreconnect.apple.com/v1/apps?limit=5", { headers: { authorization: "Bearer " + head + "." + body + "." + sig } });
            const j = await r.json().catch(() => ({}));
            if (r.ok) { console.log("Key works. Apps: " + (j.data ?? []).map((a) => a.attributes.bundleId).join(", ")); process.exit(0); }
            console.log("::error::Apple said " + r.status + ": " + (j.errors ?? []).map((e) => e.code + " - " + e.title + ": " + e.detail).join(" | "));
            process.exit(1);
          '
      - name: Store build, uploaded to App Store Connect
        if: env.HAS_SIGNING == 'true'
        working-directory: apps/web/ios/App
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.ASC_KEY_P8 }}" > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          KEY=~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          BUILD=$(( GITHUB_RUN_NUMBER + 100 ))
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION=$BUILD \
            -allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            archive
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
