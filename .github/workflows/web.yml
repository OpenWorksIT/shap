# The installable web app (Shap Pocket on Windows and other computers), published to GitHub
# Pages and served at https://www.openworks.co.za/shap/app/ through the website's rewrite.
# One-time setup: repository Settings → Pages → Source: GitHub Actions.
name: Web app

on:
  push:
    branches: [main]
    paths: ['apps/web/**', 'packages/**', 'package-lock.json', '.github/workflows/web.yml']
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: known vulnerabilities in what the app ships (high and critical fail, unless accepted)
        run: node scripts/audit-deps.mjs
      - name: every outside address in the code is on the privacy list
        run: node scripts/privacy-hosts.mjs
      - run: npm -w @shap/web run build:web
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
